worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with cache status
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'cache_status=$upstream_cache_status '
                    'response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    # ============================================
    # PROXY CACHE CONFIGURATION
    # ============================================

    # Cache path configuration
    # levels: 2 directory levels for better file distribution
    # keys_zone: 10MB of shared memory for cache keys
    # max_size: Maximum cache size on disk
    # inactive: Remove items not accessed in 60 minutes
    proxy_cache_path /var/cache/nginx/api_cache
                     levels=1:2
                     keys_zone=api_cache:10m
                     max_size=1g
                     inactive=60m
                     use_temp_path=off;

    # Microcache for dynamic content (very short TTL)
    proxy_cache_path /var/cache/nginx/micro_cache
                     levels=1:2
                     keys_zone=micro_cache:5m
                     max_size=100m
                     inactive=1m
                     use_temp_path=off;

    # Upstream backend
    upstream backend {
        server app:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint (not cached)
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # NGINX status for monitoring
        location /nginx_status {
            stub_status on;
            allow all;
        }

        # ============================================
        # CACHEABLE API ENDPOINTS
        # ============================================

        # Products API - cached for 60 seconds
        location /api/products {
            proxy_pass http://backend;

            # Enable caching
            proxy_cache api_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";

            # Cache successful responses for 60 seconds
            proxy_cache_valid 200 60s;
            proxy_cache_valid 404 10s;

            # Serve stale content while updating or on errors
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Only one request populates cache (prevents stampede)
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            # Background update
            proxy_cache_background_update on;

            # Add cache status header
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cache-Key "$scheme$request_method$host$request_uri" always;

            # Pass headers to backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Bypass cache for POST/PUT/DELETE
            proxy_cache_bypass $request_method !~ ^(GET|HEAD)$;
            proxy_no_cache $request_method !~ ^(GET|HEAD)$;
        }

        # Microcaching for semi-dynamic content (1 second TTL)
        location /api/products/microcache {
            proxy_pass http://backend;

            proxy_cache micro_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 1s;

            proxy_cache_lock on;
            proxy_cache_use_stale updating;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Microcache "true" always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # No-cache endpoints
        location /api/products/no-cache {
            proxy_pass http://backend;

            # Explicitly disable caching
            proxy_no_cache 1;
            proxy_cache_bypass 1;

            add_header X-Cache-Status "BYPASS" always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ============================================
        # CACHE PURGE ENDPOINT
        # ============================================

        location ~ /purge(/.*) {
            # In production, restrict to internal IPs
            # allow 127.0.0.1;
            # deny all;

            proxy_cache_purge api_cache "$scheme$request_method$host$1";
        }

        # ============================================
        # OTHER ENDPOINTS (NOT CACHED)
        # ============================================

        # Actuator endpoints - not cached
        location /actuator {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Demo endpoints - not cached
        location /api/demo {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Default - proxy without caching
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
